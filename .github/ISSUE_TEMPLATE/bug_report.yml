name: 🐞 Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for using DisplayCAL and wanting to report a bug.**

        Please note that this is not the place to make feature requests or ask for help.
        For this, please use the [Feature request](https://github.com/eoyilmaz/displaycal-py3/issues/new?assignees=&labels=&projects=&template=feature_request.yml) issue type.

        Before filing, please check if the issue already exists (either open or closed) by using the search bar on the issues page. If it does, comment there. Even if it's closed, we can reopen it based on your comment.
  - type: checkboxes
    attributes:
      label: Is this issue reproducible in the latest nightly build?
      description: >
        Please verify this issue still happens in the latest nightly build first. It may already be fixed there:
        [Nightly builds](https://github.com/eoyilmaz/displaycal-py3/releases/tag/nightly).
      options:
        - label: I have checked the latest nightly build and the issue is still reproducible
          required: true
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this problem?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: DisplayCAL Version
      description: Which version of DisplayCAL are you running? You can see the full version in `Help` -> `About...`.
      placeholder: e.g. 3.9.17
    validations:
      required: true
  - type: dropdown
    id: ui_toolkit
    attributes:
      label: User interface
      description: >
        Which user interface were you using? The Qt user interface is turned on under
        `Options` -> `Advanced` -> `Use Qt user interface (experimental)`.
        If you're not sure, it's the default wxPython one.
      options:
        - wxPython (default)
        - Qt
        - Both
    validations:
      required: true
  - type: dropdown
    id: os_type
    attributes:
      label: "Operating System (OS)"
      description: "What OSes are you are experiencing issues on?"
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: "OS Version"
      description: "What OS version does this relate to?"
      placeholder: "i.e. OS: Windows 7/8/10/11 ..., Ubuntu 22.04/Fedora 36 ..., macOS 10.15/11.1/12.3 ..."
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument
      description: The measurement device/instrument.
      placeholder: X-Rite i1Display Pro...
    validations:
      required: true
  - type: textarea
    id: system_info
    attributes:
      label: Additional system information
      description: Additional hardware details that may be relevant.
      placeholder: |
        CPU: 11th gen Intel r core tm i7-1185g7/AMD Ryzen 7 6800h/...
        Memory: 32/16 GB...
        Display Card: NVIDIA Quadro P400/...
    validations:
      required: false
  - type: textarea
    id: reproduce_steps
    attributes:
      label: How to reproduce
      description: Please described the detailed steps to reproduce this issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: actual_results
    attributes:
      label: Actual results
      description: What happens after the above steps? Please, enclose a screenshot whenever possible (even when you think the description is clear).
    validations:
      required: true
  - type: textarea
    id: expected_results
    attributes:
      label: Expected results
      description: What should happen after the above steps?
    validations:
      required: true
  - type: markdown
    id: file_required
    attributes:
      value: |
        Please be sure to add the log files:
          * The **log files** for crashes and similar issues.
            Tools -> Show Log Window -> Create Compressed Archive...

            Otherwise, you can find your log file here:
            Windows: `%APPDATA%\DisplayCAL\logs` or usually `C:\Users\<your username>\AppData\Roaming\DisplayCAL\logs`
            macOS: `~/Library/Logs/DisplayCAL`
            Linux: `~/.local/share/DisplayCAL/logs`

            You can zip the log directory, or just select the newest logs when this issue happens, and zip them
  - type: textarea
    id: file_uploads
    attributes:
      label: Debug log uploads
      description:  Drop the debug log here
      placeholder: |
        Log File:  `Tools` -> `Show Log Window` -> `Create Compressed Archive`, then drop the *.tgz file here.
    validations:
      required: false
  - type: checkboxes
    id: file_checklist
    attributes:
      label: Checklist of files to include
      options:
        - label: Log file
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Screenshots? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
