"donation_message": |-
  Se desideri supportare lo sviluppo, l'assistenza tecnica e la continua disponibilità di DisplayCAL e ArgyllCMS, considera un contributo economico. Poiché DisplayCAL non sarebbe utile senza ArgyllCMS, tutti i contributi ricevuti per DisplayCAL saranno suddivisi tra entrambi i progetti.

  Per un uso personale leggero e non commerciale può essere appropriato un contributo una tantum. Se usi DisplayCAL professionalmente, un contributo annuale o mensile farebbe una grande differenza per garantire che entrambi i progetti continuino a essere disponibili.

  Grazie a tutti i contributori!
