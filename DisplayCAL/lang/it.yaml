"drift_compensation.blacklevel": |-
  Compensazione deriva livello nero
"drift_compensation.blacklevel.info": |-
  La compensazione deriva livello nero cerca di contrastare deviazioni di misura causate dalla deriva della calibrazione del nero di uno strumento che si riscalda. A questo scopo viene misurata periodicamente una patch nera, aumentando il tempo complessivo necessario per le misure. Molti colorimetri hanno compensazione temperatura integrata, in tal caso la compensazione deriva livello nero non dovrebbe essere necessaria, ma la maggior parte degli spettrometri non ha compensazione temperatura.
"drift_compensation.whitelevel": |-
  Compensazione deriva livello bianco
"drift_compensation.whitelevel.info": |-
  La compensazione deriva livello bianco cerca di contrastare deviazioni di misura causate da variazioni di luminanza di un display in riscaldamento. A questo scopo viene misurata periodicamente una patch bianca, aumentando il tempo complessivo necessario per le misure.
