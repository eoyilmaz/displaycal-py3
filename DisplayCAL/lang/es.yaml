"drift_compensation.blacklevel": |-
  Compensacion de la desviacion del nivel del negro
"drift_compensation.blacklevel.info": |-
  La compensacion de la desviacion del nivel del negro trata de contar desviaciones de la medicion por desviacion de la calibracion del negro marcadas por las advertencias del instrumento de medicion. Para este proposito, un parche de negro es medido periodicamente, lo que incrementa el tiempo total necesario para las mediciones. Muchos colorimetros tiene incorporada compensacion de temepratura, en cuyo caso la compensacion de la desviacion del negro no es necesaria, pero la mayor parte de los espectrofotometros no tiene compensacion de temperatura.
"drift_compensation.whitelevel": |-
  Desviacion de la compensacion del nivel de blanco
"drift_compensation.whitelevel.info": |-
  La desviacion de la compensacion del nivel de blanco trata de contar desviaciones de la medicion causadas por cambios de luminancia  marcadas por las advertencias de la pantalla. Para este proposito, un parche de blanco es medido periodicamente, lo que incrementa el tiempo total necesario para las mediciones.
