"info.3dlut_settings": |-
  Una <font weight='bold'>LUT 3D</font> (LUT = Look Up Table) o un profilo ICC device link può essere usato da applicazioni compatibili con LUT 3D o ICC device link per una <font weight='bold'>correzione colore completa del display</font>.

  <font weight='bold'>Creare più LUT 3D (aggiuntive) da un profilo esistente</font>
  Con il profilo desiderato selezionato in “Impostazioni”, deseleziona la casella “Crea LUT 3D dopo la profilazione”.

  <font weight='bold'>Scegliere il corretto spazio colore sorgente e la curva di risposta tonale</font>
  Per LUT 3D e profili ICC device link, spazio colore sorgente e curva di risposta tonale devono essere impostati in anticipo e diventano parte fissa della trasformazione colore complessiva (a differenza dei profili ICC dispositivo, collegati dinamicamente al volo). Ad esempio, il materiale video HD è solitamente masterizzato secondo Rec. 709 con gamma power pura intorno a 2.2-2.4 (relativa con offset nero output 100%) o curva di risposta tonale Rec. 1886 (assoluta con offset nero output 0%). È possibile anche una via intermedia tra Rec. 1886-like e power pura impostando l'offset nero output tra 0% e 100%.

  <font weight='bold'>Gamma “assoluta” vs “relativa”</font>
  Per adattarsi a un livello nero non nullo di un display reale, la curva di risposta tonale deve essere opportunamente traslata e scalata.
  La gamma “assoluta” produce un output reale al 50% input che non corrisponde a quello di una curva power idealizzata (a meno che il livello nero sia zero).
  La gamma “relativa” produce un output reale al 50% input che corrisponde a quello di una curva power idealizzata.

  <font weight='bold'>Intento di rendering</font>
  Se hai calibrato su un punto di bianco diverso da quello richiesto dallo spazio colore sorgente e vuoi usare quello per la LUT 3D, seleziona “Colorimetrico relativo”. Altrimenti seleziona “Colorimetrico assoluto con scalatura punto di bianco” (la scalatura punto di bianco eviterà clipping in modalità colorimetrica assoluta che potrebbe verificarsi se il punto di bianco sorgente è fuori gamut display). Puoi anche usare un intento di rendering non colorimetrico che comprima o espanda lo spazio colore sorgente per adattarlo al gamut display (non consigliato quando è richiesta accuratezza colorimetrica).
"info.calibration_settings": |-
  La <font weight='bold'>calibrazione</font> viene eseguita <font weight='bold'>regolando interattivamente il display</font> per soddisfare punto di bianco e/o luminanza scelti, nonché opzionalmente creando <font weight='bold'>curve di calibrazione LUT 1D</font> (LUT = Look Up Table) per rispettare la curva di risposta tonale scelta e garantire il bilanciamento dei grigi. Nota che se durante la calibrazione vuoi solo regolare il display e saltare la generazione di curve LUT 1D, devi impostare la curva di risposta tonale su “Come misurato”. La calibrazione LUT 1D <font weight='bold'>non</font> può essere usata per la correzione colore completa del display: devi creare un <font weight='bold'>profilo dispositivo ICC</font> o una <font weight='bold'>LUT 3D</font> e usarli con applicazioni che li supportano. La calibrazione LUT 1D è comunque complementare a profilazione e calibrazione LUT 3D.
"info.display_instrument": |-
  <font weight='bold'>Disabilita tutte le impostazioni immagine dinamiche del display</font> se applicabile. Questo può includere contrasto dinamico, dimming, luminosità automatica e funzioni simili.

  Assicurati che la luce non colpisca direttamente lo schermo.

  Se il tuo display è una TV <font weight='bold'>OLED</font> o <font weight='bold'>Plasma</font>, o altro tipo con emissione luminosa variabile in base al contenuto immagine, abilita la <font weight='bold'>compensazione deriva livello bianco</font>.

  Se il tuo strumento è uno <font weight='bold'>spettrometro</font> e lo usi in modalità contatto su un display con livello nero stabile, potresti voler abilitare la <font weight='bold'>compensazione deriva livello nero dello strumento</font>.

  Se il tuo strumento è un <font weight='bold'>colorimetro</font>, dovresti usare una <font weight='bold'>modalità di misura</font> o <font weight='bold'>correzione</font> adatta al tuo display o alla sua tecnologia. Nota che alcuni strumenti (es. K-10, Spyder4/5/X) possono offrire modalità di misura già ottimizzate per specifici tipi di display.
"info.display_instrument.warmup": |-
  Lascia riscaldare il display per almeno <font weight='bold'>30 minuti</font> prima di iniziare le misure. Se usi lo strumento in modalità contatto, è una buona idea lasciarlo sul display durante questo tempo.
"info.display_tech": |-
  <font weight='bold'>LCD White LED</font> (WLED con gamut normale e copertura sRGB fino al 100%) è la tecnologia retroilluminazione LCD più comune.

  <font weight='bold'>LCD PFS Phosphor WLED</font> ha gamut ampio in due varianti comuni con copertura P3 o Adobe RGB intorno al 90-99%.

  <font weight='bold'>LCD Quantum Dot LED</font> ha gamut ampio con copertura P3 quasi completa, comunemente usata nelle TV Samsung QLED.

  <font weight='bold'>WOLED</font> ha gamut ampio con alta copertura P3, comunemente usato nelle TV LG OLED.

  <font weight='bold'>RGB OLED/AMOLED</font> ha gamut ampio con copertura quasi completa Adobe RGB e/o P3.

  <font weight='bold'>LCD GB-r-LED</font> (nota anche come GB-LED) ha gamut ampio con copertura Adobe RGB intorno al 99%.

  <font weight='bold'>LCD RGB LED</font> ha gamut ampio con copertura Adobe RGB quasi completa.

  <font weight='bold'>LCD CCFL</font> e <font weight='bold'>LCD CCFL Wide Gamut</font> sono tecnologie più vecchie comunemente usate nei display del 2009 e precedenti.
"info.display_tech.linklabel.displayspecifications.com": |-
  Trova monitor/TV e tecnologia corrispondente su displayspecifications.com
"info.display_tech.linklabel.everymac.com": |-
  Trova iMac/MacBook/iPad e tecnologia display corrispondente su everymac.com
"info.display_tech.show": |-
  Mostra informazioni sulle tecnologie display comuni
"info.mr_settings": |-
  Puoi <font weight='bold'>verificare l'accuratezza</font> di un profilo ICC o LUT 3D tramite un report di misura che contiene statistiche dettagliate sugli errori colore delle patch misurate.

  Quando verifichi una LUT 3D, assicurati di usare le stesse impostazioni con cui è stata creata.

  <font weight='bold'>Suggerimento:</font> per creare un report di autocontrollo invece di un report di misura, tieni premuto ALT sulla tastiera.
"info.profile_settings": |-
  La <font weight='bold'>profilazione</font> è il processo di <font weight='bold'>caratterizzazione</font> del display e registrazione della sua risposta in un <font weight='bold'>profilo dispositivo ICC</font>. Il profilo ICC può essere usato da applicazioni con gestione colore ICC per una <font weight='bold'>correzione colore completa del display</font> e/o per creare una <font weight='bold'>LUT 3D</font>.

  La quantità di patch misurate influisce sull'accuratezza ottenibile del profilo risultante. Per una qualità ragionevole in un profilo basato su matrice 3x3 e curve, possono bastare poche decine di patch se il display ha buona linearità e buona miscelazione additiva. Se è richiesta la massima accuratezza possibile, è consigliato un profilo basato su LUT da alcune centinaia a diverse migliaia di patch. L'impostazione carta di test <font weight='bold'>“Auto-optimized”</font> tiene conto automaticamente delle non linearità e della risposta reale del display e dovrebbe essere usata per i migliori risultati.
