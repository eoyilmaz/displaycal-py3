"argyll.instrument.driver.missing": |-
  Il driver ArgyllCMS per il tuo dispositivo di misura sembra non essere installato o essere installato in modo non corretto. Verifica se il dispositivo di misura è mostrato in Gestione dispositivi di Windows sotto “Argyll LibUSB-1.0A devices” e (re)installa il driver se necessario. Consulta la documentazione per le istruzioni di installazione.
"argyll.instrument.drivers.install": |-
  Installa i driver degli strumenti ArgyllCMS...
"argyll.instrument.drivers.install.confirm": |-
  È necessario installare i driver specifici di ArgyllCMS solo se il tuo strumento di misura non è un ColorMunki Display, i1 Display Pro, Huey, ColorHug, specbos, spectraval o K-10.

  Vuoi procedere?
"argyll.instrument.drivers.install.failure": |-
  Installazione dei driver degli strumenti ArgyllCMS non riuscita.
"argyll.instrument.drivers.install.restart": |-
  Devi disabilitare l'imposizione della firma dei driver per installare i driver degli strumenti ArgyllCMS. A tale scopo il sistema deve essere riavviato. Seleziona “Risoluzione dei problemi” nella pagina che apparirà, poi “Opzioni avanzate”, “Impostazioni di avvio” e infine “Riavvia”. All'avvio, seleziona “Disabilita imposizione firma driver”. Dopo il riavvio, scegli di nuovo “Installa i driver degli strumenti ArgyllCMS...” nel menu per installare i driver. Se non vedi l'opzione “Risoluzione dei problemi”, consulta la sezione della documentazione DisplayCAL “Installazione del driver dello strumento in Windows” per un metodo alternativo per disabilitare l'imposizione della firma dei driver.
"argyll.instrument.drivers.uninstall": |-
  Disinstalla i driver degli strumenti ArgyllCMS...
"argyll.instrument.drivers.uninstall.confirm": |-
  Nota: la disinstallazione non influisce sui driver dello strumento attualmente in uso, ma rimuove solo il driver dal Driver Store di Windows. Se vuoi tornare a usare un driver del produttore già installato per il tuo strumento, dovrai usare Gestione dispositivi di Windows per passare manualmente al driver del produttore. Per farlo, fai clic destro sullo strumento e seleziona “Aggiorna software driver...”, quindi scegli “Cerca il software del driver nel computer”, “Scegli manualmente da un elenco di driver di dispositivo nel computer” e infine seleziona dall'elenco il driver del produttore per il tuo strumento.

  Vuoi procedere?
"argyll.instrument.drivers.uninstall.failure": |-
  Disinstallazione dei driver degli strumenti ArgyllCMS non riuscita.
"argyll.instrument.drivers.uninstall.success": |-
  Disinstallazione dei driver degli strumenti ArgyllCMS completata.
