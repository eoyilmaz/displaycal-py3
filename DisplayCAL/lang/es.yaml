"info.3dlut_settings": |-
  Un <font weight='bold'>LUT 3D</font> (LUT = Look Up Table) o perfil de enlace de dispositivo ICC puede ser utilizado por aplicaciones compatibles con LUT 3D o enlaces de dispositivo ICC para una <font weight='bold'>corrección de color completa de la pantalla</font>.

  <font weight='bold'>Creación de varios LUT 3D (adicionales) a partir de un perfil existente</font>
  Con el perfil deseado seleccionado en “Ajustes”, desmarque la casilla “Crear LUT 3D después de perfilar”.

  <font weight='bold'>Elegir el espacio de color de origen y la curva de respuesta tonal adecuados</font>
  Para LUT 3D y perfiles ICC de enlace de dispositivo, el espacio de color de origen y la curva de respuesta tonal deben definirse por adelantado y pasan a ser una parte fija de la transformación de color global (a diferencia de los perfiles de dispositivo ICC, que se enlazan dinámicamente sobre la marcha). Por ejemplo, el material de video HD suele masterizarse según el estándar Rec. 709 con una gamma de potencia pura de alrededor de 2.2-2.4 (relativa con desplazamiento de salida del negro del 100%) o con la curva de respuesta tonal Rec. 1886 (absoluta con desplazamiento de salida del negro del 0%). También es posible una solución intermedia entre Rec. 1886 y potencia pura estableciendo el desplazamiento de salida del negro en un valor entre 0% y 100%.

  <font weight='bold'>Gamma “absoluta” frente a “relativa”</font>
  Para adaptarse a un nivel de negro distinto de cero de una pantalla real, la curva de respuesta tonal debe desplazarse y escalarse en consecuencia.
  La gamma “absoluta” produce una salida real al 50% de entrada que no coincide con la de una curva de potencia idealizada (a menos que el nivel de negro sea cero).
  La gamma “relativa” produce una salida real al 50% de entrada que sí coincide con la de una curva de potencia idealizada.

  <font weight='bold'>Intención de renderizado</font>
  Si ha calibrado a un punto blanco distinto del exigido por el espacio de color de origen y quiere usar ese punto blanco para el LUT 3D, seleccione “Colorimétrico relativo”. De lo contrario, seleccione “Colorimétrico absoluto con escalado de punto blanco” (el escalado de punto blanco evitará recortes en modo colorimétrico absoluto que podrían ocurrir si el punto blanco del espacio de color de origen queda fuera de la gama de la pantalla). También puede usar una intención de renderizado no colorimétrica que comprima o expanda el espacio de color de origen para ajustarlo a la gama de la pantalla (no recomendado cuando se requiere precisión colorimétrica).
"info.calibration_settings": |-
  La <font weight='bold'>calibración</font> se realiza <font weight='bold'>ajustando interactivamente la pantalla</font> para alcanzar el punto blanco y/o la luminancia elegidos, y opcionalmente creando <font weight='bold'>curvas de calibración LUT 1D</font> (LUT = Look Up Table) para cumplir la curva de respuesta tonal elegida y asegurar el equilibrio de grises. Tenga en cuenta que, si durante la calibración solo desea ajustar la pantalla y omitir la generación de curvas LUT 1D, debe establecer la curva de respuesta tonal en “Como se ha medido”. La calibración LUT 1D <font weight='bold'>no</font> puede usarse para una corrección de color completa de la pantalla; para ello debe crear un <font weight='bold'>perfil de dispositivo ICC</font> o un <font weight='bold'>LUT 3D</font> y usarlos con aplicaciones que los admitan. No obstante, la calibración LUT 1D complementa el perfilado y la calibración LUT 3D.
"info.display_instrument": |-
  <font weight='bold'>Desactive cualquier ajuste dinámico de imagen de su pantalla</font>, si aplica. Esto puede incluir funciones como contraste dinámico, atenuación, brillo automático y características similares.

  Asegúrese de que no incida luz directamente sobre la pantalla.

  Si su pantalla es un TV <font weight='bold'>OLED</font> o <font weight='bold'>Plasma</font>, u otro tipo con salida de luz variable según el contenido de imagen, active la <font weight='bold'>compensación de deriva del nivel de blanco</font>.

  Si su instrumento es un <font weight='bold'>espectrómetro</font> y lo usa en modo de contacto sobre una pantalla con nivel de negro estable, puede que quiera activar la <font weight='bold'>compensación de deriva del nivel de negro del instrumento</font>.

  Si su instrumento es un <font weight='bold'>colorímetro</font>, debería usar un <font weight='bold'>modo de medición</font> o <font weight='bold'>corrección</font> adecuado para su pantalla o tipo de tecnología de pantalla. Tenga en cuenta que algunos instrumentos (p. ej., K-10, Spyder4/5/X) pueden ofrecer una selección de modos de medición ya ajustados para tipos de pantalla específicos.
"info.display_instrument.warmup": |-
  Debe dejar que la pantalla se <font weight='bold'>caliente</font> durante al menos <font weight='bold'>30 minutos</font> antes de comenzar las mediciones. Si usa el instrumento en modo de contacto, también es buena idea dejarlo sobre la pantalla durante ese tiempo.
"info.display_tech": |-
  <font weight='bold'>LCD White LED</font> (WLED con gama de color normal y cobertura sRGB de hasta el 100%) es la tecnología de retroiluminación LCD más común. Las pantallas de esta categoría incluyen la mayoría de portátiles, notebooks, monitores todoterreno/oficina y monitores gaming no HDR desde 2010 en adelante, así como Apple iMac/MacBook desde 2009 hasta mediados de 2015.

  <font weight='bold'>LCD PFS Phosphor WLED</font> tiene una gama de color amplia en dos variantes comunes con cobertura P3 o Adobe RGB de alrededor del 90-99% (según datos del fabricante). Las pantallas comunes en la categoría de gama P3 incluyen Apple iMac 4K/5K Retina (finales de 2015 en adelante), MacBook Pro Retina (finales de 2016 en adelante), así como algunos monitores de escritorio compatibles con HDR. La categoría de gama Adobe RGB incluye pantallas profesionales como EIZO CG2730, HP DreamColor Z24x G2 o NEC PA271Q.

  <font weight='bold'>LCD Quantum Dot LED</font> tiene una gama de color amplia con cobertura P3 casi completa, usada comúnmente en TVs Samsung QLED.

  <font weight='bold'>WOLED</font> tiene una gama de color amplia con alta cobertura P3, usada comúnmente en TVs LG OLED.

  <font weight='bold'>RGB OLED/AMOLED</font> tiene una gama de color amplia con cobertura casi completa de Adobe RGB y/o P3, utilizada en algunos monitores y portátiles profesionales, así como en smartphones de alta calidad.

  <font weight='bold'>LCD GB-r-LED</font> (también conocida como GB-LED) tiene una gama de color amplia con cobertura Adobe RGB de alrededor del 99% (según datos del fabricante). Las pantallas comunes de esta categoría incluyen Dell U2413, EIZO CG247/CG277 y NEC PA242W/PA272W.

  <font weight='bold'>LCD RGB LED</font> tiene una gama de color amplia con cobertura Adobe RGB casi completa. Las pantallas comunes de esta categoría incluyen Samsung XL20/XL24/XL30 y HP DreamColor LP2480zx.

  <font weight='bold'>LCD CCFL</font> y <font weight='bold'>LCD CCFL Wide Gamut</font> son tecnologías de retroiluminación más antiguas, usadas comúnmente en pantallas de 2009 y anteriores.
