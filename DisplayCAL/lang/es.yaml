"profile_loader.fix_profile_associations_warning": |-
  Mientras el cargador de perfiles esté en ejecución, puede encargarse de las asociaciones de perfiles cuando cambie la configuración de pantalla.

  Antes de continuar, asegúrese de que las asociaciones de perfiles mostradas arriba sean correctas. Si no lo son, siga estos pasos:

  1. Abra la configuración de pantalla de Windows.
  2. Active todas las pantallas conectadas (escritorio extendido).
  3. Abra las asociaciones de perfiles.
  4. Asegúrese de que cada dispositivo de pantalla tenga asignado el perfil correcto. Luego cierre las asociaciones de perfiles.
  5. En la configuración de pantalla de Windows, vuelva a la configuración de pantalla anterior y cierre la configuración de pantalla.
  6. Ahora puede activar “Corregir automáticamente las asociaciones de perfiles”.
