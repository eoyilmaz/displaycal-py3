"profile_loader.fix_profile_associations_warning": |-
  Finché il caricatore profilo è in esecuzione, può occuparsi delle associazioni profilo quando cambi la configurazione display.

  Prima di procedere, assicurati che le associazioni profilo mostrate sopra siano corrette. Se non lo sono, segui questi passaggi:

  1. Apri impostazioni display Windows.
  2. Attiva tutti i display collegati (desktop esteso).
  3. Apri associazioni profilo.
  4. Assicurati che ogni dispositivo display abbia il profilo corretto assegnato. Poi chiudi associazioni profilo.
  5. Nelle impostazioni display Windows, torna alla configurazione display precedente e chiudi impostazioni display.
  6. Ora puoi abilitare “Correggi automaticamente associazioni profilo”.
