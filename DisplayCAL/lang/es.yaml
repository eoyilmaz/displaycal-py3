"donation_header": |-
  ¡Se agradece su apoyo!
"donation_message": |-
  Si desea apoyar el desarrollo, la asistencia técnica y la disponibilidad continua de DisplayCAL y ArgyllCMS, considere realizar una contribución económica. Como DisplayCAL no sería útil sin ArgyllCMS, todas las contribuciones recibidas para DisplayCAL se repartirán entre ambos proyectos.

  Para un uso personal ligero y no comercial, puede ser apropiada una contribución única. Si utiliza DisplayCAL de forma profesional, una contribución anual o mensual marcaría una gran diferencia para garantizar que ambos proyectos sigan estando disponibles.

  ¡Gracias a todos los colaboradores!
