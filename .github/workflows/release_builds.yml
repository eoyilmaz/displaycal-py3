name: Release Builds

# Triggered when `make new-release` pushes a version tag to GitHub.
# Builds all platform artifacts, then creates the GitHub release and
# attaches them.  PyPI upload remains in `make new-release` (twine).
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'  # e.g. 3.9.18, 3.9.18.1

permissions:
  contents: write  # required to create GitHub releases

jobs:

  # -----------------------------------------------------------------------
  # Windows  (x64 + ARM64)
  # -----------------------------------------------------------------------
  windows:
    name: Build on Windows (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            os: windows-latest
            python-version: '3.11'
          - architecture: arm64
            os: windows-11-arm
            python-version: '3.13'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Inno Setup (ARM64 runner)
        if: matrix.architecture == 'arm64'
        run: choco install innosetup -y

      - name: Fix user Scripts missing from PATH
        run: |
          $ScriptsPath = python -c "import sysconfig,os; print(sysconfig.get_path('scripts'))"
          Add-Content $env:GITHUB_PATH $ScriptsPath

      - name: Install py2exe from source (ARM64)
        if: matrix.architecture == 'arm64'
        run: |
          git clone --depth 1 https://github.com/py2exe/py2exe.git C:\py2exe_src
          uv pip install --system wheel setuptools
          $env:PYTHONPATH = "C:\py2exe_src"
          uv pip install --system --no-build-isolation C:\py2exe_src

      - name: Install Python dependencies
        run: |
          uv pip install --system wheel setuptools
          uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Fix pywin32
        run: |
          $ScriptsPath = python -c "import sysconfig,os; print(sysconfig.get_path('scripts'))"
          python "$ScriptsPath\pywin32_postinstall.py" -install

      - name: Build DisplayCAL
        run: |
          uv build
          $version = Get-Content DisplayCAL\VERSION
          $wheel_file = Get-ChildItem dist\*.whl | Select-Object -First 1
          uv pip install --system $wheel_file
          copy misc/net.displaycal.DisplayCAL.appdata.xml dist/net.displaycal.DisplayCAL.appdata.xml

      - name: Run freeze.py
        run: python DisplayCAL\freeze.py

      - name: Create INNO script
        run: python native_build.py inno

      - name: Build Windows Installer
        run: |
          cd dist
          iscc.exe DisplayCAL-Setup-py2exe.win-${{ matrix.architecture == 'x64' && 'amd64' || 'arm64' }}-py${{ matrix.python-version }}.iss

      - name: Rename installer to release name
        run: |
          Move-Item dist/DisplayCAL-*-Setup.exe dist/DisplayCAL-${{ github.ref_name }}-Windows-${{ matrix.architecture }}.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: dist/DisplayCAL-${{ github.ref_name }}-Windows-${{ matrix.architecture }}.exe

  # -----------------------------------------------------------------------
  # macOS  (arm64 + x86_64)
  # -----------------------------------------------------------------------
  macOS:
    name: Build on macOS (${{ matrix.os }} ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        architecture: [arm64, x64]
        include:
          - architecture: arm64
            os: macos-14
          - architecture: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies (${{ matrix.os }}-${{ matrix.architecture }})
        run: brew install create-dmg gtk+3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install wheel helper
        run: uv pip install --system wheel

      - name: Install Python dependencies
        run: |
          uv pip install --system --compile-bytecode -r requirements.txt -r requirements-dev.txt
          # Needs a floor too, not just the <82 ceiling: the macOS python.org
          # build bundles a much older setuptools that already satisfies "<82"
          # on its own, so an upper-bound only constraint leaves that ancient
          # version in place instead of upgrading it, and it predates
          # SPDX-string `project.license` support.
          uv pip install --system "setuptools>=75,<82"

      - name: Build DisplayCAL
        run: |
          uv build --no-build-isolation
          version=$(cat DisplayCAL/VERSION)
          uv pip install --system ./dist/displaycal-${version}-*.whl --force-reinstall

      - name: Build macOS APP
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          ARCHFLAGS: "-arch ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}"
        run: |
          TARGET_ARCH="${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}"
          python native_build.py py2app --arch=$TARGET_ARCH

      - name: Force Ad-Hoc Signing
        run: |
          for APP_PATH in dist/*/DisplayCAL-*/*.app; do
            echo "Signing $APP_PATH..."
            find -L "$APP_PATH" -type f -name "*.dylib" -exec codesign --remove-signature {} +
            find -L "$APP_PATH" -type f -name "*.so" -exec codesign --remove-signature {} +
            find -L "$APP_PATH" -type d -name "*.framework" -exec codesign --remove-signature {} +
            find -L "$APP_PATH/Contents" -type d -name "*.app" -exec codesign --remove-signature {} +
            # PySide6 ships its Qt6 .framework bundles *without* the usual
            # macOS framework symlinks (no Versions/Current, no top-level
            # <Name>/Resources symlinks) -- Versions/A/<Name> sits there as
            # a bare, non-symlinked Mach-O binary. codesign's bundle
            # executable-discovery relies on those symlinks (plus
            # Info.plist's CFBundleExecutable) to find the real binary, so
            # pointing codesign at the .framework directory itself only
            # touches Resources/Info.plist and never reaches
            # Versions/A/<Name> at all -- confirmed locally: after signing
            # every *.framework directory below, `codesign --verify --strict`
            # on QtCore.framework/Versions/A/QtCore still failed with "code
            # or signature have been modified", and dlopen'ing
            # PySide6/QtCore.abi3.so reproduced the exact crash users saw
            # ("Invalid Page" SIGKILL). Must strip and re-sign each
            # framework's real binary directly, in addition to the
            # .framework directory itself.
            find -L "$APP_PATH/Contents" -type d -name "*.framework" | while read -r FW; do
              NAME=$(basename "$FW" .framework)
              find -L "$FW/Versions" -mindepth 2 -maxdepth 2 -type f -name "$NAME" -exec codesign --remove-signature {} +
            done
            find -L "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign -s - -f -o linker-signed {} +
            # QtWebEngineCore.framework bundles its own nested Helper .app
            # (Helpers/QtWebEngineProcess.app, duplicated again under
            # Versions/A/Helpers/), a separate code object that codesign
            # requires to already be signed before it will accept signing
            # anything that references it -- this applies not just to the
            # containing .framework directory (as originally found) but
            # also to the framework's own real Versions/A/<Name> binary
            # sitting right next to Helpers/: codesign treats that as
            # bundle-adjacent too and refuses to sign it with "code object
            # is not signed at all, in subcomponent: .../QtWebEngineProcess.app"
            # if the Helper isn't already signed (reproduced locally by
            # stripping a real QtWebEngineCore.framework and running these
            # passes in isolation). So .app dirs must be signed first, then
            # each framework's real binary, then the .framework directory
            # pass -- confirmed with `codesign --verify --deep --strict`
            # against a real QtWebEngineCore.framework in this exact order.
            find -L "$APP_PATH/Contents" -type d -name "*.app" -exec codesign -s - -f -o linker-signed {} +
            # Sign each Qt framework's real binary directly -- see the
            # matching comment in the strip-signatures pass above for why
            # the .framework-directory pass below can't reach it.
            find -L "$APP_PATH/Contents" -type d -name "*.framework" | while read -r FW; do
              NAME=$(basename "$FW" .framework)
              find -L "$FW/Versions" -mindepth 2 -maxdepth 2 -type f -name "$NAME" -exec codesign -s - -f -o linker-signed {} +
            done
            find -L "$APP_PATH/Contents" -type d -name "*.framework" -exec codesign -s - -f -o linker-signed {} +
            codesign --force --deep --options runtime --entitlements misc/entitlements.plist --sign - "$APP_PATH"
          done

      - name: Build macOS DMG
        run: |
          version=$(cat DisplayCAL/VERSION)
          build_folder=$(ls dist | grep -i py2app.macosx)
          TARGET_ARCH="${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}"

          STAGING_DIR="dist/dmg_staging"
          mkdir -p "$STAGING_DIR"
          mv "dist/${build_folder}/DisplayCAL-${version}" "$STAGING_DIR/DisplayCAL"
          xattr -cr "$STAGING_DIR/DisplayCAL"
          ln -s /Applications "$STAGING_DIR/Applications"

          create-dmg \
            --volname "DisplayCAL-${{ github.ref_name }}" \
            "dist/DisplayCAL-${{ github.ref_name }}-macOS-${TARGET_ARCH}.dmg" \
            "$STAGING_DIR"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: dist/DisplayCAL-${{ github.ref_name }}-macOS-*.dmg

  # -----------------------------------------------------------------------
  # Linux  (DEB + RPM, amd64/x86_64)
  # -----------------------------------------------------------------------
  linux:
    name: Build Linux packages (DEB/RPM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Install Python build dependencies
        run: uv pip install --system wheel

      - name: Build DisplayCAL wheel
        run: |
          uv build
          VERSION=$(cat DisplayCAL/VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          # dpkg and rpm sort "3.10.0rc1" after "3.10.0", "3.10.0~rc1" before it
          PKG_VERSION=$(echo "${VERSION}" | sed -E 's/\.?((a|b|rc|dev)[0-9]*)$/~\1/')
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_ENV

      - name: Create package staging directory
        run: |
          VERSION=${{ env.VERSION }}
          STAGING=/tmp/displaycal-staging

          mkdir -p "${STAGING}/opt/displaycal"
          cp dist/displaycal-${VERSION}-*.whl "${STAGING}/opt/displaycal/"

          # Every runtime dependency as a prebuilt wheel, so the post-install
          # script sets up the venv offline, without reaching PyPI (#983)
          util/linux_package/vendor_wheels.sh "${STAGING}/opt/displaycal/wheels"

          mkdir -p "${STAGING}/usr/bin"
          for cmd in displaycal displaycal-3dlut-maker displaycal-curve-viewer \
                     displaycal-eecolor-to-madvr-converter displaycal-profile-info \
                     displaycal-scripting-client displaycal-synthprofile \
                     displaycal-testchart-editor displaycal-vrml-to-x3d-converter \
                     displaycal-vrml-to-x3d-converter-console; do
            printf '#!/bin/sh\nexec /opt/displaycal/venv/bin/%s "$@"\n' "${cmd}" \
              > "${STAGING}/usr/bin/${cmd}"
            chmod 755 "${STAGING}/usr/bin/${cmd}"
          done

          mkdir -p "${STAGING}/usr/share/applications"
          cp misc/displaycal*.desktop "${STAGING}/usr/share/applications/"

          for size_dir in DisplayCAL/theme/icons/*/; do
            size=$(basename "${size_dir}")
            for icon in "${size_dir}"displaycal*.png; do
              [ -f "${icon}" ] || continue
              dest="${STAGING}/usr/share/icons/hicolor/${size}/apps"
              mkdir -p "${dest}"
              cp "${icon}" "${dest}/$(basename "${icon}")"
            done
          done

          mkdir -p "${STAGING}/usr/lib/udev/rules.d"
          cp misc/55-Argyll.rules "${STAGING}/usr/lib/udev/rules.d/"
          cp misc/45-Argyll.rules "${STAGING}/usr/lib/udev/rules.d/"

          mkdir -p "${STAGING}/usr/share/metainfo"
          cp misc/net.displaycal.DisplayCAL.appdata.xml "${STAGING}/usr/share/metainfo/"

      - name: Build DEB package
        run: |
          fpm \
            -s dir \
            -t deb \
            -n displaycal \
            -v "${{ env.PKG_VERSION }}" \
            --description "Display calibration and profiling with a focus on accuracy and versatility" \
            --url "https://displaycal.net/" \
            --license "GPL-3.0-or-later" \
            --maintainer "Erkan Ozgur Yilmaz <eoyilmaz@gmail.com>" \
            --category graphics \
            --depends "python3 (>= 3.11)" \
            --depends "python3-venv" \
            --depends "python3-wxgtk4.0" \
            --depends "python3-dbus" \
            --depends "libegl1" \
            --depends "libgl1" \
            --depends "libfontconfig1" \
            --depends "libxkbcommon0" \
            --depends "libxkbcommon-x11-0" \
            --depends "libxcb-cursor0" \
            --depends "libxcb-icccm4" \
            --depends "libxcb-image0" \
            --depends "libxcb-keysyms1" \
            --depends "libxcb-render-util0" \
            --depends "libxcb-shape0" \
            --depends "libxcb-xinerama0" \
            --after-install util/linux_package/postinstall.sh \
            --before-remove util/linux_package/preremove.sh \
            -C /tmp/displaycal-staging \
            --package dist/ \
            .
          mv dist/*.deb "dist/DisplayCAL-${{ github.ref_name }}-Linux-amd64.deb"

      - name: Build RPM package
        run: |
          RPM_VERSION=$(echo "${{ env.PKG_VERSION }}" | tr '-' '_' | tr '+' '.')
          fpm \
            -s dir \
            -t rpm \
            -n displaycal \
            -v "${RPM_VERSION}" \
            --iteration 1 \
            --description "Display calibration and profiling with a focus on accuracy and versatility" \
            --url "https://displaycal.net/" \
            --license "GPL-3.0-or-later" \
            --maintainer "Erkan Ozgur Yilmaz <eoyilmaz@gmail.com>" \
            --rpm-summary "Display calibration and profiling" \
            --category "Applications/Multimedia" \
            --depends "python3 >= 3.11" \
            --depends "python3-wxpython4" \
            --depends "python3-dbus" \
            --depends "mesa-libEGL" \
            --depends "mesa-libGL" \
            --depends "fontconfig" \
            --depends "libxkbcommon" \
            --depends "libxkbcommon-x11" \
            --depends "xcb-util-cursor" \
            --depends "xcb-util-wm" \
            --depends "xcb-util-image" \
            --depends "xcb-util-keysyms" \
            --depends "xcb-util-renderutil" \
            --after-install util/linux_package/postinstall.sh \
            --before-remove util/linux_package/preremove.sh \
            -C /tmp/displaycal-staging \
            --package dist/ \
            .
          mv dist/*.rpm "dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.rpm"

      - name: Test package installs without network access
        run: |
          for image in debian:bookworm ubuntu:24.04 debian:trixie; do
            util/linux_package/test_install.sh "${image}" dist/*.deb
          done
          util/linux_package/test_install.sh fedora:43 dist/*.rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/DisplayCAL-${{ github.ref_name }}-Linux-amd64.deb
            dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.rpm

  # -----------------------------------------------------------------------
  # Linux  (AppImage, x86_64)
  # -----------------------------------------------------------------------
  linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install runtime libraries needed by wxPython, dbus-python build deps, and Qt's xcb/OpenGL plugins
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-3-0 libnotify4 libsdl2-2.0-0 libwebkit2gtk-4.1-0 libdbus-1-dev libglib2.0-dev gdk-pixbuf2.0-dev librsvg2-common shared-mime-info \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libsm6 \
            libegl1 libgl1 libglx0 libopengl0 libxkbcommon0

      - name: Install Python build dependencies
        run: uv pip install --system wheel

      - name: Build DisplayCAL wheel
        run: |
          uv build
          VERSION=$(cat DisplayCAL/VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build AppImage
        run: |
          WHEEL_FILE=$(ls dist/displaycal-${{ env.VERSION }}-*.whl)
          chmod +x misc/appimage/build-appimage.sh
          misc/appimage/build-appimage.sh "$WHEEL_FILE" "${{ env.VERSION }}" \
            "dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.AppImage

  # -----------------------------------------------------------------------
  # Linux  (Flatpak, x86_64)
  # -----------------------------------------------------------------------
  linux-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak install --system -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build Flatpak
        run: flatpak-builder --force-clean --repo=repo build-dir misc/flatpak/net.displaycal.DisplayCAL.yml

      - name: Create Flatpak bundle
        run: |
          mkdir -p dist
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo "dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.flatpak" net.displaycal.DisplayCAL

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/DisplayCAL-${{ github.ref_name }}-Linux-x86_64.flatpak

  # -----------------------------------------------------------------------
  # Create GitHub Release and attach all platform assets
  # -----------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [windows, macOS, linux, linux-appimage, linux-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check whether the tag is a pre-release
        id: version
        run: |
          # "3.10.0" and "3.9.18.1" are releases, "3.10.0rc1" is a pre-release
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DisplayCAL ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: artifacts/**
