"warning.devlink_profile.missing": |-
  Nessun profilo di collegamento dispositivo selezionato, quindi nessuna 3D LUT viene applicata alle patch misurate e il rapporto mostra lo schermo stesso rispetto al profilo di simulazione. Per verificare una 3D LUT, seleziona il profilo di collegamento dispositivo salvato accanto ad essa.
"warning.discard_changes": |-
  Vuoi scartare le modifiche?
"warning.gamap.out_viewcond.nondisplay": |-
  La condizione di visione di destinazione “%s” non è una condizione di visione display. Vuoi comunque usarla?
"warning.input_value_clipping": |-
  Avviso: i valori sotto il punto nero del profilo display verranno clippati!
"warning.suspicious_delta_e": |-
  Avviso: sono state trovate misure sospette. Nota che questo controllo assume un display simile a sRGB. Se il tuo display differisce da questa ipotesi (ad es. gamut molto ampio o risposta tonale molto diversa da sRGB), gli errori trovati potrebbero non essere significativi.

  È stato soddisfatto uno o più dei seguenti criteri:

  • Patch consecutive con numeri RGB diversi ma ΔE*00 sospettosamente basso tra le rispettive misure.
  • Grigio RGB con numeri RGB crescenti rispetto alla patch precedente ma luminosità (L*) decrescente.
  • Grigio RGB con numeri RGB decrescenti rispetto alla patch precedente ma luminosità (L*) crescente.
  • ΔE*00 e ΔL*00 o ΔH*00 o ΔC*00 insolitamente alti delle misure rispetto all'equivalente sRGB dei numeri RGB.

  Questo potrebbe indicare errori di misura. I valori considerati problematici (il che non deve necessariamente essere vero) sono evidenziati in rosso. Controlla attentamente le misure e marca quelle che vuoi accettare. Puoi anche modificare i valori RGB e XYZ.
"warning.suspicious_delta_e.info": |-
  Spiegazione delle colonne Δ:

  ΔE*00 XYZ A/B: ΔE*00 dei valori misurati rispetto ai valori misurati della patch precedente. Se questo valore manca, non era un fattore durante il controllo. Se è presente, si assume che sia troppo basso.

  0.5 ΔE*00 RGB A/B: ΔE*00 dell'equivalente sRGB dei numeri RGB rispetto all'equivalente sRGB dei numeri RGB della patch precedente (con fattore 0.5). Se presente, rappresenta il valore di confronto (minimo) durante il controllo di un ΔE*00 XYZ A/B presumibilmente troppo basso. Serve come orientamento molto approssimativo.

  ΔE*00 RGB-XYZ: ΔE*00 dei valori misurati rispetto all'equivalente sRGB dei numeri RGB.
  ΔL*00 RGB-XYZ: ΔL*00 dei valori misurati rispetto all'equivalente sRGB dei numeri RGB.
  ΔC*00 RGB-XYZ: ΔC*00 dei valori misurati rispetto all'equivalente sRGB dei numeri RGB.
  ΔH*00 RGB-XYZ: ΔH*00 dei valori misurati rispetto all'equivalente sRGB dei numeri RGB.
